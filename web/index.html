<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>نظام قراءة الميزان</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    let port;
    let reader;
    let latestWeight = "0.0";
    let isConnected = false;
    let keepReading = true;
    let buffer = ""; // مخزن مؤقت لتجميع أجزاء الوزن

    async function connectScale() {
      if (!navigator.serial) {
        alert("متصفحك لا يدعم الوصول للكابل. يرجى استخدام Chrome.");
        return false;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({
          baudRate: 9600,
          dataBits: 8,
          stopBits: 1,
          parity: "none"
        });
        isConnected = true;
        keepReading = true;
        buffer = ""; // تصفير المخزن عند البداية
        startReadLoop();
        return true;
      } catch (error) {
        console.error(error);
        return false;
      }
    }

    async function startReadLoop() {
      const decoder = new TextDecoder();
      while (port.readable && keepReading) {
        reader = port.readable.getReader();
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            // إضافة الجزء الجديد للمخزن
            buffer += decoder.decode(value);

            // الموازين ترسل علامة نهاية سطر (غالباً \r أو \n)
            // نبحث عن السطر المكتمل
            if (buffer.includes('\r') || buffer.includes('\n')) {
              let lines = buffer.split(/[\r\n]+/);

              // نأخذ آخر سطر مكتمل (قبل الأخير لأن الأخير قد يكون غير مكتمل)
              let completeLine = lines.length > 1 ? lines[lines.length - 2] : lines[0];

              // استخراج الرقم فقط من السطر المكتمل
              const matches = completeLine.match(/[0-9.]+/g);
              if (matches && matches.length > 0) {
                let val = matches[matches.length - 1];
                // تجاهل سرعة الاتصال (9600) إذا ظهرت في البداية
                if (val !== "9600" && val !== "9200") {
                  latestWeight = val;
                }
              }

              // الاحتفاظ بالجزء المتبقي غير المكتمل في المخزن
              buffer = lines[lines.length - 1];
            }
          }
        } catch (error) {
          isConnected = false;
          break;
        } finally {
          reader.releaseLock();
        }
      }
    }

    function getLiveWeight() { return latestWeight; }
    function isScaleConnected() { return isConnected; }
    async function disconnectScale() {
      keepReading = false;
      if (reader) await reader.cancel();
      if (port) await port.close();
      isConnected = false;
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
